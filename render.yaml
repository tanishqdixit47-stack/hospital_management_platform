# Render Blueprint — Hospital Management System
# Deploys both services from this repository in one go:
#   1. hospital-api       → Express backend (Node web service)
#   2. hospital-frontend  → React build (static site)
#
# Deploy: Render Dashboard → New → Blueprint → select this repository.
# Values marked sync:false are prompted for in the dashboard on first deploy.

services:
  # ---------------- Backend: Express + Mongoose API ----------------
  - type: web
    name: hospital-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/dashboard
    envVars:
      # Paste your MongoDB Atlas connection string when prompted.
      # (It is never committed to the repository.)
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production

  # ---------------- Frontend: React + Vite static site ----------------
  - type: web
    name: hospital-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the final backend URL on Render, e.g.
      # https://hospital-api.onrender.com/api  (prompted on first deploy)
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA fallback: any path serves the React app (React Router handles it).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Never cache index.html so new deployments are picked up immediately.
      - path: /*
        name: Cache-Control
        value: no-cache
