# CI/CD Pipeline — Hospital Management System
#
# CI  (Continuous Integration): on every push / pull request to main,
#      the backend is syntax-checked and the frontend is production-built.
# CD  (Continuous Deployment): when CI passes on main, the pipeline
#      triggers Render to redeploy the backend and frontend services.
#
# Secrets required (repo Settings → Secrets and variables → Actions):
#   RENDER_DEPLOY_HOOK_BACKEND  – Render deploy hook URL of the backend service
#   RENDER_DEPLOY_HOOK_FRONTEND – Render deploy hook URL of the frontend service
# Until they are set, the deploy job prints a reminder and stays green.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-backend:
    name: CI — Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check all source files
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f"
          done
          echo "All backend JS files are syntactically valid."

      - name: Verify entry point starts without MongoDB (config sanity)
        run: |
          node -e "
            const path = require('path');
            process.env.MONGO_URI = '';
            ['routes','controllers','models','middleware','utils'].forEach((dir) => {
              require('fs').readdirSync(dir).forEach((file) => {
                if (file.endsWith('.js')) require(path.resolve(dir, file));
              });
            });
            console.log('All backend modules load without errors.');
          "

  ci-frontend:
    name: CI — Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  cd-deploy:
    name: CD — Deploy to Render
    needs: [ci-backend, ci-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend redeploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_BACKEND is not set — skipping backend deploy."
            echo "Add it at repo Settings → Secrets and variables → Actions."
          else
            curl -fsS -X POST "$HOOK_URL" && echo "Backend deploy triggered on Render."
          fi

      - name: Trigger frontend redeploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_FRONTEND is not set — skipping frontend deploy."
            echo "Add it at repo Settings → Secrets and variables → Actions."
          else
            curl -fsS -X POST "$HOOK_URL" && echo "Frontend deploy triggered on Render."
          fi
